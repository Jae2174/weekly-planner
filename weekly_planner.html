<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C2C2A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1A18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주간 계획">
<title>주간 계획</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%232C2C2A'/><text x='90' y='118' font-family='-apple-system,sans-serif' font-size='90' font-weight='600' fill='%23E1F5EE' text-anchor='middle'>주</text></svg>">
<style>
  :root {
    --bg: #FAFAF7; --surface: #FFFFFF; --surface-2: #F5F3EC; --surface-3: #F1EFE8;
    --border: #E5E3DA; --border-strong: #C9C7BD;
    --text: #2C2C2A; --text-secondary: #5F5E5A; --text-tertiary: #888780;
    --work-bg: #E1F5EE; --work-text: #04342C; --work-accent: #0F6E56;
    --work-soft: #F0FAF6;
    --life-bg: #FBF6EE; --life-text: #4A3B1B; --life-accent: #854F0B;
    --life-soft: #FDF9F2;
    --contact-bg: #F1EFE8; --review-bg: #FFFBEA; --review-text: #8B6B00;
    --rock-work-bg: #EEEDFE; --rock-work-accent: #534AB7;
    --rock-life-bg: #F0E6F4; --rock-life-accent: #993556;
    --danger: #A32D2D; --info: #185FA5; --info-bg: #E6F1FB;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
    --radius: 10px; --radius-sm: 6px;
    --status-pending: #8A8880; --status-doing: #BA7517; --status-doing-bg: #FBF1E0;
    --status-done: #0F6E56; --status-done-bg: #D4EEE2; --status-pass: #888780;
    --status-pending-bg: #EEEDE8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1A18; --surface: #25251F; --surface-2: #2D2D27; --surface-3: #34342C;
      --border: #3A3A33; --border-strong: #4D4D44;
      --text: #ECEAE0; --text-secondary: #B4B2A9; --text-tertiary: #888780;
      --work-bg: #1F3D33; --work-text: #9FE1CB; --work-accent: #5DCAA5;
      --work-soft: #1A2F28;
      --life-bg: #3D332A; --life-text: #FAC775; --life-accent: #EF9F27;
      --life-soft: #2D261E;
      --contact-bg: #2D2D27; --review-bg: #3D3520; --review-text: #FAC775;
      --rock-work-bg: #2A2645; --rock-work-accent: #AFA9EC;
      --rock-life-bg: #3D2333; --rock-life-accent: #ED93B1;
      --info-bg: #1A3A5C;
      --status-pending: #7A7870; --status-doing: #FAC775; --status-doing-bg: #3D3520;
      --status-done: #5DCAA5; --status-done-bg: #1F3D33; --status-pending-bg: #2D2D27;
      --contact-bg: #34342C;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input, textarea, select { font: inherit; color: inherit; background: transparent; border: none; outline: none; resize: none; width: 100%; }
  input::placeholder, textarea::placeholder { color: var(--text-tertiary); opacity: 0.55; }

  .app { max-width: 1280px; margin: 0 auto; padding: 14px; }

  /* ─── Login / Loading ─── */
  .login-screen, .loading-screen { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
  .loading-screen { color: var(--text-tertiary); font-size: 13px; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 32px; max-width: 400px; text-align: center; box-shadow: var(--shadow); }
  .login-card h1 { font-size: 22px; margin: 0 0 12px; font-weight: 600; }
  .login-card p { font-size: 13px; color: var(--text-secondary); margin: 0 0 24px; line-height: 1.6; }
  .google-btn { padding: 12px 32px; background: var(--text); color: var(--bg); border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
  .google-btn:hover { opacity: 0.88; }

  /* ─── Top bar ─── */
  .topbar { display: flex; align-items: center; gap: 6px; padding: 4px 4px 12px; flex-wrap: wrap; }
  .topbar h1 { font-size: 18px; font-weight: 600; margin: 0 8px 0 0; flex-shrink: 0; }
  .week-nav { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; }
  .week-nav button { padding: 6px 10px; border-radius: 4px; font-size: 13px; color: var(--text-secondary); }
  .week-nav button:hover { background: var(--surface-2); color: var(--text); }
  .week-nav .current { font-weight: 500; padding: 6px 10px; color: var(--text); min-width: 120px; text-align: center; font-size: 12px; }
  .today-jump { padding: 6px 10px; font-size: 11px; color: var(--info); background: var(--info-bg); border-radius: var(--radius-sm); }
  .actions { display: flex; gap: 4px; margin-left: auto; align-items: center; flex-wrap: wrap; }
  .actions button { padding: 6px 10px; font-size: 11px; color: var(--text-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
  .actions button:hover { background: var(--surface-2); color: var(--text); }
  .actions .small-btn { padding: 6px 8px; font-size: 11px; }
  .actions .sync-btn { background: var(--info-bg); color: var(--info); border: 1px solid var(--info); font-weight: 500; padding: 7px 14px; font-size: 12px; }
  .actions .sync-btn:hover { background: var(--info); color: white; }
  .save-indicator { font-size: 11px; color: var(--text-tertiary); padding: 0 8px; transition: color 0.2s; min-width: 80px; text-align: right; }
  .save-indicator.saving { color: var(--text-secondary); }
  .save-indicator.saved { color: var(--status-done); }
  .save-indicator.error { color: var(--danger); font-weight: 500; }

  /* ─── View tabs ─── */
  .view-tabs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; }
  .view-tabs button { padding: 6px 14px; font-size: 12px; border-radius: 4px; color: var(--text-secondary); font-weight: 500; }
  .view-tabs button.active { background: var(--text); color: var(--bg); }

  /* ─── Weekly card ─── */
  .weekly-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .section-title { font-size: 10px; letter-spacing: 0.08em; color: var(--text-tertiary); text-transform: uppercase; margin: 0 0 6px; font-weight: 600; }
  .rocks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .rock-col h3 { font-size: 10px; font-weight: 600; margin: 0 0 6px; color: var(--text-tertiary); letter-spacing: 0.05em; }
  .rock-item { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 4px; margin-bottom: 2px; }
  .rock-item.work { background: var(--rock-work-bg); }
  .rock-item.life { background: var(--rock-life-bg); }
  .rock-item .check-btn { font-size: 14px; cursor: pointer; user-select: none; flex-shrink: 0; color: var(--text-tertiary); }
  .rock-item.work.done .check-btn { color: var(--rock-work-accent); }
  .rock-item.life.done .check-btn { color: var(--rock-life-accent); }
  .rock-item .n { font-size: 10px; color: var(--text-tertiary); flex-shrink: 0; width: 12px; font-weight: 600; }
  .rock-item input { font-size: 13px; }
  .rock-item.work input { color: var(--rock-work-accent); }
  .rock-item.life input { color: var(--rock-life-accent); }
  .rock-item.done input { text-decoration: line-through; opacity: 0.6; }
  .default-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; padding: 6px 8px; background: var(--surface-2); border-radius: var(--radius-sm); align-items: center; }
  .default-slots .label { font-size: 10px; color: var(--text-tertiary); }
  .default-slots input { text-align: center; font-size: 11px; color: var(--work-accent); font-weight: 500; padding: 3px; background: transparent; border-radius: 3px; }
  .default-slots input:focus { background: var(--surface); }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calendar .cal-day { background: var(--surface-2); border-radius: var(--radius-sm); padding: 5px 6px; min-height: 60px; max-height: 120px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; gap: 2px; transition: background 0.15s; }
  .calendar .cal-day:hover { background: var(--surface-3); }
  .calendar .cal-day.today { background: var(--info-bg); outline: 2px solid var(--info); outline-offset: -1px; }
  .calendar .cal-day .dow { font-size: 10px; color: var(--text-tertiary); margin-bottom: 1px; font-weight: 500; flex-shrink: 0; }
  .calendar .cal-day.today .dow { color: var(--info); }
  .cal-event-pill { font-size: 11px; line-height: 1.3; padding: 2px 5px; border-radius: 3px; background: var(--work-soft); color: var(--work-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .cal-event-pill.has-time { color: var(--work-accent); font-weight: 500; }
  .cal-add-hint { font-size: 10px; color: var(--text-tertiary); opacity: 0.6; margin-top: auto; }

  /* ─── Calendar Modal ─── */
  .cal-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
  @media (min-width: 541px) { .cal-modal-overlay { align-items: center; } }
  .cal-modal { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 12px; }
  .cal-modal::before { content: ''; display: block; width: 40px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 8px; flex-shrink: 0; }
  @media (min-width: 541px) { .cal-modal { border-radius: var(--radius); max-height: 80vh; } }
  .cal-modal-header { display: flex; align-items: center; justify-content: space-between; }
  .cal-modal-title { font-size: 16px; font-weight: 700; color: var(--text); }
  .cal-modal-close { font-size: 20px; color: var(--text-tertiary); background: none; border: none; cursor: pointer; padding: 4px 8px; line-height: 1; }
  .cal-event-list { display: flex; flex-direction: column; gap: 8px; }
  .cal-event-card { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .cal-event-card-row { display: flex; align-items: center; gap: 8px; }
  .cal-event-card input[type=time], .cal-event-card input[type=text] { flex: 1; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; color: var(--text); }
  .cal-event-card textarea { width: 100%; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; color: var(--text); resize: none; min-height: 52px; box-sizing: border-box; }
  .cal-event-card-footer { display: flex; align-items: center; justify-content: space-between; }
  .cal-notify-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
  .cal-notify-toggle input { accent-color: var(--work-accent); width: 14px; height: 14px; }
  .cal-del-btn { font-size: 11px; color: var(--text-tertiary); background: none; border: none; cursor: pointer; padding: 2px 6px; }
  .cal-del-btn:hover { color: #e53e3e; }
  .cal-add-event-btn { width: 100%; padding: 10px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-sm); background: none; color: var(--text-secondary); font-size: 13px; cursor: pointer; }
  .cal-add-event-btn:hover { background: var(--surface-2); }

  /* ─── Stats ─── */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; margin-bottom: 12px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; }
  .stat-card .stat-label { font-size: 10px; color: var(--text-tertiary); margin-bottom: 2px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; }
  .stat-card .stat-value { font-size: 17px; font-weight: 600; color: var(--text); }
  .stat-card .stat-sub { font-size: 10px; color: var(--text-secondary); margin-top: 1px; }

  /* ─── Day picker (모바일 + 오늘 탭) ─── */
  .day-picker { display: flex; gap: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 12px; overflow-x: auto; }
  .day-picker button { padding: 6px 8px; font-size: 11px; border-radius: 4px; color: var(--text-secondary); flex: 1; min-width: 44px; text-align: center; }
  .day-picker button .dow { display: block; font-size: 10px; opacity: 0.7; }
  .day-picker button .dd { display: block; font-weight: 600; font-size: 13px; }
  .day-picker button.active { background: var(--text); color: var(--bg); }
  .day-picker button.today { color: var(--info); font-weight: 600; }
  .day-picker button.today.active { background: var(--info); color: white; }

  /* ─── 주간 탭: 7일 카드 ─── */
  .weekly-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 12px; }
  .day-card-mini { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 360px; }
  .day-card-mini.today { border: 2px solid var(--info); }
  .day-card-mini .day-header { background: var(--text); color: var(--bg); padding: 5px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 500; }
  .day-card-mini .day-header .today-badge { background: var(--info); color: white; font-size: 9px; padding: 1px 5px; border-radius: 8px; }
  .day-card-mini .mini-section { padding: 5px 6px; border-bottom: 1px solid var(--border); }
  .day-card-mini .mini-section:last-child { border-bottom: none; }
  .day-card-mini .mini-label { font-size: 9px; color: var(--text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; margin-bottom: 3px; }
  .day-card-mini .work-block { background: var(--work-soft); }
  .day-card-mini .life-block { background: var(--life-soft); }
  .day-card-mini .contact-block { background: var(--contact-bg); }
  .day-card-mini .review-block { background: var(--review-bg); margin-top: auto; }
  .day-card-mini .mini-action { display: flex; gap: 3px; align-items: flex-start; margin-bottom: 1px; }
  .day-card-mini .mini-action .status-mini { font-size: 11px; padding-top: 2px; cursor: pointer; user-select: none; flex-shrink: 0; }
  .day-card-mini .mini-action .mini-text { flex: 1; font-size: 11px; line-height: 1.3; }
  .day-card-mini .mini-action.done .mini-text { text-decoration: line-through; opacity: 0.55; }
  .day-card-mini .mini-action .mini-text textarea { font-size: 11px; min-height: 18px; padding: 1px 3px; line-height: 1.3; }
  .day-card-mini .mini-contact { font-size: 11px; padding: 1px 0; display: flex; gap: 4px; }
  .day-card-mini .mini-contact .status-mini { flex-shrink: 0; cursor: pointer; }
  .day-card-mini .mini-contact span:last-child { flex: 1; }
  .day-card-mini .mini-contact.done span:last-child { text-decoration: line-through; opacity: 0.55; }
  .day-card-mini .mini-review-text { font-size: 11px; font-style: italic; color: var(--review-text); }

  /* ─── 오늘 탭: full-width day ─── */
  .today-view { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .today-header { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
  .today-header.is-today { border: 2px solid var(--info); }
  .today-header h2 { font-size: 18px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .today-header .today-badge-lg { background: var(--info); color: white; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: 500; }
  .today-header .summary { display: flex; gap: 12px; font-size: 11px; color: var(--text-secondary); }
  .ai-fill-btn { padding: 7px 12px; font-size: 12px; font-weight: 500; background: linear-gradient(135deg, #7F77DD, #ED93B1); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; }
  .ai-fill-btn:hover { opacity: 0.9; }
  .today-header .summary span strong { color: var(--text); }

  /* WORK 3 슬롯 (가로 또는 세로) */
  .work-slots-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .work-slot { background: var(--work-bg); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; min-height: 320px; }
  .work-slot.done { opacity: 0.7; }
  .slot-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .slot-header .slot-n { font-size: 11px; color: var(--work-accent); opacity: 0.7; font-weight: 600; width: 14px; flex-shrink: 0; }
  .slot-header .slot-cat input { font-size: 11px; color: var(--work-accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; background: rgba(255,255,255,0.4); padding: 3px 6px; border-radius: 3px; }
  .slot-header .status-pill { margin-left: auto; flex-shrink: 0; }
  .slot-action { background: rgba(255,255,255,0.5); border-radius: var(--radius-sm); padding: 8px; margin-bottom: 8px; }
  .slot-action textarea { font-size: 14px; min-height: 32px; color: var(--work-text); font-weight: 500; line-height: 1.4; }
  .slot-action.done textarea { text-decoration: line-through; }
  .wbs-toggle { background: rgba(255,255,255,0.3); border-radius: var(--radius-sm); padding: 5px 8px; font-size: 11px; color: var(--work-accent); font-weight: 500; cursor: pointer; user-select: none; text-align: left; margin-bottom: 4px; }
  .wbs-toggle:hover { background: rgba(255,255,255,0.5); }
  .wbs-area.collapsed { display: none; }
  .wbs-area { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .wbs-area .wbs-row { background: rgba(255,255,255,0.35); border-radius: var(--radius-sm); padding: 6px 8px; }
  .wbs-area .wbs-row .wbs-label { font-size: 9px; color: var(--work-accent); opacity: 0.6; font-weight: 600; letter-spacing: 0.08em; margin-bottom: 2px; }
  .wbs-area .wbs-row textarea { font-size: 12px; min-height: 28px; color: var(--work-text); line-height: 1.4; }
  .wbs-area .tasks-row .tasks-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .wbs-area .tasks-row .tasks-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.4); border-radius: 2px; overflow: hidden; max-width: 80px; }
  .wbs-area .tasks-row .tasks-bar .fill { height: 100%; background: var(--work-accent); transition: width 0.3s; }
  .wbs-area .tasks-row .task-item { display: flex; align-items: flex-start; gap: 4px; padding: 2px 0; }
  .wbs-area .tasks-row .task-item .check-btn { font-size: 13px; cursor: pointer; user-select: none; padding-top: 1px; flex-shrink: 0; color: var(--work-accent); opacity: 0.6; }
  .wbs-area .tasks-row .task-item.done .check-btn { opacity: 1; }
  .wbs-area .tasks-row .task-item textarea { font-size: 12px; min-height: 20px; padding: 1px 4px; line-height: 1.4; color: var(--work-text); }
  .wbs-area .tasks-row .task-item.done textarea { text-decoration: line-through; opacity: 0.55; }
  .wbs-area .tasks-row .task-item .del-btn { font-size: 11px; color: var(--text-tertiary); padding: 2px 4px; opacity: 0; flex-shrink: 0; }
  .wbs-area .tasks-row .task-item:hover .del-btn, .wbs-area .tasks-row .task-item:focus-within .del-btn { opacity: 1; }
  .wbs-area .tasks-row .add-task { font-size: 11px; color: var(--work-accent); opacity: 0.7; padding: 2px 4px; margin-top: 2px; }
  .wbs-area .tasks-row .add-task:hover { opacity: 1; }

  /* Status pill */
  .status-pill { display: inline-flex; align-items: center; gap: 3px; padding: 4px 9px; min-height: 28px; border-radius: 10px; font-size: 11px; font-weight: 500; cursor: pointer; user-select: none; line-height: 1.2; transition: filter 0.12s; }
  .status-pill:active { filter: brightness(0.92); }
  .status-pill.pending { background: var(--status-pending-bg); color: var(--status-pending); }
  .status-pill.doing { background: var(--status-doing-bg); color: var(--status-doing); }
  .status-pill.done { background: var(--status-done-bg); color: var(--status-done); }
  .status-pill.pass { background: var(--status-pending-bg); color: var(--status-pass); text-decoration: line-through; }

  /* LIFE 슬롯 */
  .life-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); }

    }
    // 북마크: 옛 매트릭스 형태 → 새 카테고리 형태로 흡수 (옛 데이터가 있으면 "개인"에 다 합침)
    if (!w.bookmark || !Array.isArray(w.bookmark.categories)) {
      const oldBookmarkTexts = [];
      if (w.matrix.bookmark) {
        for (const key in w.matrix.bookmark) {
          const v = w.matrix.bookmark[key];
          if (typeof v === 'string' && v.trim()) {
            v.split('\n').filter(s => s.trim()).forEach(s => oldBookmarkTexts.push(s.trim()));
          }
        }
      }
      w.bookmark = emptyBookmark();
      oldBookmarkTexts.forEach(t => w.bookmark.items.push({
        id: 'b' + Date.now() + Math.random().toString(36).slice(2,7),
        category: '개인', title: t, link: '', detail: ''
      }));
    }
    if (!w.defaultSlots) w.defaultSlots = ['','',''];
    if (!w.calendarEvents) {
      // 기존 calendar 문자열 데이터를 이벤트 배열로 마이그레이션
      w.calendarEvents = (w.calendar || ['','','','','','','']).map(s =>
        (s && s.trim()) ? [{ id: Date.now() + Math.random(), time: '', place: '', memo: s, notify: false }] : []
      );
    }
    if (!w.rocks) w.rocks = { work: [{text:'',done:false},{text:'',done:false},{text:'',done:false}], life: [{text:'',done:false},{text:'',done:false}] };
    if (!w.days) w.days = [emptyDay(), emptyDay(), emptyDay(), emptyDay(), emptyDay(), emptyDay(), emptyDay()];
    for (const d of w.days) {
      if (!d.workActions) d.workActions = [emptyAction(), emptyAction(), emptyAction()];
      if (!d.lifeActions) d.lifeActions = [emptyLifeAction(), emptyLifeAction(), emptyLifeAction()];
      for (const a of d.workActions) {
        if (typeof a.tasks === 'string') a.tasks = strToTasks(a.tasks);
        if (!Array.isArray(a.tasks)) a.tasks = [];
      }
      // 요청 리스트 backward 호환
      if (!Array.isArray(d.requestsToOthers)) d.requestsToOthers = [];
      if (!Array.isArray(d.requestsFromOthers)) d.requestsFromOthers = [];
      // 연락 항목 구조 마이그레이션 (text → name)
      if (!d.contacts) d.contacts = [];
      d.contacts = d.contacts.map(c => ({
        checked: !!c.checked,
        name: c.name || c.text || '',
        purpose: c.purpose || '',
        callMemo: c.callMemo || '',
        datetime: c.datetime || '',
      }));
    }
  }
  return s;
}

function migrateV1(v1) {
  const s = { schemaVersion: SCHEMA_VERSION, weeks: {} };
  for (const k in v1.weeks) {
    const old = v1.weeks[k];
    const nw = emptyWeek();
    // Rocks
    if (old.rocks) {
      for (let i = 0; i < 3; i++) nw.rocks.work[i] = { text: (old.rocks.work && old.rocks.work[i]) || '', done: !!(old.rocks.workDone && old.rocks.workDone[i]) };
      for (let i = 0; i < 2; i++) nw.rocks.life[i] = { text: (old.rocks.life && old.rocks.life[i]) || '', done: !!(old.rocks.lifeDone && old.rocks.lifeDone[i]) };
    }
    if (old.slots) nw.defaultSlots = old.slots.slice(0,3);
    if (old.calendar) nw.calendar = old.calendar.slice(0,7);
    // Days
    if (old.days) {
      for (let i = 0; i < 7 && i < old.days.length; i++) {
        const od = old.days[i];
        const nd = emptyDay();
        for (let j = 0; j < 3; j++) {
          nd.workActions[j] = {
            text: (od.action && od.action[j]) || '',
            cat: nw.defaultSlots[j] || '',
            status: 'pending',
            resources: (od.resources && od.resources[j]) || '',
            prereq: (od.prereq && od.prereq[j]) || '',
            tasks: strToTasks((od.tasks && od.tasks[j]) || ''),
          };
          nd.lifeActions[j] = { text: (od.life && od.life[j]) || '', status: 'pending' };
        }
        if (od.contacts) nd.contacts = od.contacts.map(c => ({
          checked: !!c.checked, name: c.name || c.text || '', purpose: c.purpose || '', callMemo: c.callMemo || '', datetime: c.datetime || ''
        }));
        nd.review = od.review || '';
        nw.days[i] = nd;
      }
    }
    s.weeks[k] = nw;
  }
  // 매트릭스는 v1에서는 global이었음. 현재 week에 옮김
  if (v1.matrix) {
    const cur = weekKey(mondayOf(todayDate()));
    if (!s.weeks[cur]) s.weeks[cur] = emptyWeek();
    if (v1.matrix.idea) s.weeks[cur].matrix.idea = v1.matrix.idea;
    if (v1.matrix.bookmark) s.weeks[cur].matrix.bookmark = v1.matrix.bookmark;
  }
  return s;
}

// ── 알림 권한 요청 & 예약 ──
async function requestNotifyPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  const perm = await Notification.requestPermission();
  return perm === 'granted';
}
function scheduleWeekNotifications() {
  notifyTimers.forEach(clearTimeout);
  notifyTimers = [];
  const w = getWeek(currentMonday);
  if (!w.calendarEvents) return;
  w.calendarEvents.forEach((events, i) => {
    const date = addDays(currentMonday, i);
    events.forEach(ev => {
      if (!ev.notify || !ev.time) return;
      const [h, m] = ev.time.split(':').map(Number);
      const notifyAt = new Date(date);
      notifyAt.setHours(h, m - 10, 0, 0); // 10분 전
      const delay = notifyAt - Date.now();
      if (delay > 0 && delay < 86400000 * 7) {
        const t = setTimeout(() => {
          if (Notification.permission === 'granted') {
            new Notification((ev.place || '일정 알림') + ' · ' + ev.time, {
              body: ev.memo || '',
              icon: 'https://weekly-planner-60203.web.app/icon.png',
            });
          }
        }, delay);
        notifyTimers.push(t);
      }
    });
  });
}

function openCalModal(dayIdx) {
  calModalDayIdx = dayIdx;
  renderCalModalDOM();
}
function closeCalModal() {
  calModalDayIdx = null;
  const existing = document.getElementById('cal-modal-overlay');
  if (existing) existing.remove();
}
function renderCalModalDOM() {
  const existing = document.getElementById('cal-modal-overlay');
  if (existing) existing.remove();
  if (calModalDayIdx === null) return;

  const w = getWeek(currentMonday);
  const dayDate = addDays(currentMonday, calModalDayIdx);
  const dayLabel = DAYS_KOR[calModalDayIdx] + ' ' + dayDate.getDate() + '일';
  const events = w.calendarEvents[calModalDayIdx] || [];

  const overlay = el('div', { class: 'cal-modal-overlay', id: 'cal-modal-overlay',
    onclick: (e) => { if (e.target === overlay) closeCalModal(); }
  });

  function buildEventCard(ev, idx) {
    const card = el('div', { class: 'cal-event-card' });
    const timeInput = el('input', { type: 'time', value: ev.time || '' });
    timeInput.addEventListener('change', () => { ev.time = timeInput.value; saveState(); scheduleWeekNotifications(); });
    const placeInput = el('input', { type: 'text', placeholder: '장소', value: ev.place || '' });
    placeInput.addEventListener('input', () => { ev.place = placeInput.value; saveState(); updatePills(); });
    const memoTA = el('textarea', { placeholder: '메모' });
    memoTA.value = ev.memo || '';
    memoTA.addEventListener('input', () => { ev.memo = memoTA.value; saveState(); updatePills(); });
    const notifyChk = el('input', { type: 'checkbox' });
    notifyChk.checked = !!ev.notify;
    notifyChk.addEventListener('change', async () => {
      if (notifyChk.checked) {
        const ok = await requestNotifyPermission();
        if (!ok) { notifyChk.checked = false; alert('알림 권한이 없어요. 브라우저 설정에서 허용해 주세요.'); return; }
      }
      ev.notify = notifyChk.checked;
      saveState(); scheduleWeekNotifications();
    });
    const delBtn = el('button', { class: 'cal-del-btn', onclick: () => {
      events.splice(idx, 1);
      saveState(); updatePills(); renderCalModalDOM();
    }}, '삭제');
    card.appendChild(el('div', { class: 'cal-event-card-row' }, timeInput, placeInput));
    card.appendChild(memoTA);
    card.appendChild(el('div', { class: 'cal-event-card-footer' },
      el('label', { class: 'cal-notify-toggle' }, notifyChk, '10분 전 알림'),
      delBtn
    ));
    return card;
  }

  const eventList = el('div', { class: 'cal-event-list' });
  events.forEach((ev, i) => eventList.appendChild(buildEventCard(ev, i)));

  const addBtn = el('button', { class: 'cal-add-event-btn', onclick: () => {
    events.push({ id: Date.now(), time: '', place: '', memo: '', notify: false });
    saveState(); renderCalModalDOM();
    // 새 카드의 시간 input에 포커스
    setTimeout(() => {
      const inputs = document.querySelectorAll('.cal-event-card input[type=time]');
      if (inputs.length) inputs[inputs.length-1].focus();
    }, 50);
  }}, '+ 일정 추가');

  const modal = el('div', { class: 'cal-modal',
    onclick: (e) => e.stopPropagation()
  },
    el('div', { class: 'cal-modal-header' },
      el('div', { class: 'cal-modal-title' }, dayLabel),
      el('button', { class: 'cal-modal-close', onclick: closeCalModal }, '×')
    ),
    eventList,
    addBtn
  );
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  // 첫 번째 카드 없으면 바로 추가 시작
  if (events.length === 0) addBtn.click();
}

// 원격 동기화 데이터를 입력 중에는 적용하지 않고, 포커스 해제 후 반영
function applyRemoteState(newState) {
  const active = document.activeElement;
  if (active && (active.tagName === 'TEXTAREA' || active.tagName === 'INPUT')) {
    pendingRemoteState = newState;
    const applyWhenDone = () => {
      active.removeEventListener('blur', applyWhenDone);
      if (pendingRemoteState) {
        state = normalizeState(pendingRemoteState);
        pendingRemoteState = null;
        render();
      }
    };
    active.addEventListener('blur', applyWhenDone);
    return;
  }
  state = normalizeState(newState);
  render();
}

function saveState() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { console.warn('local save failed', e); }
    await saveToFirestore();
  }, 600);
}

function setSaveStatus(s) { saveStatus = s; updateSaveIndicator(); }
function updateSaveIndicator() {
  const elIndicator = document.getElementById('save-indicator');
  if (!elIndicator) return;
  elIndicator.className = 'save-indicator ' + saveStatus;
  if (saveStatus === 'saving') {
    elIndicator.textContent = '저장 중...';
  } else if (saveStatus === 'error') {
    elIndicator.textContent = '저장 실패 ⚠';
  } else if (lastSavedAt) {
    const ago = Math.floor((Date.now() - lastSavedAt.getTime()) / 1000);
    if (ago < 5) elIndicator.textContent = '방금 저장 ✓';
    else if (ago < 60) elIndicator.textContent = ago + '초 전 저장됨';
    else if (ago < 3600) elIndicator.textContent = Math.floor(ago/60) + '분 전 저장됨';
    else elIndicator.textContent = Math.floor(ago/3600) + '시간 전 저장됨';
  } else {
    elIndicator.textContent = '';
  }
}

let lastSaveError = null;
async function saveToFirestore() {
  if (!currentUser) { lastSaveError = '로그인 안 됨'; return false; }
  setSaveStatus('saving');
  try {
    await setDoc(doc(db, 'users', currentUser.uid), {
      stateJson: JSON.stringify(state), // Firestore가 nested array 지원 안 해서 문자열로
      email: currentUser.email,
      updatedAt: serverTimestamp(),
    }, { merge: true });
    lastSavedAt = new Date();
    lastSaveError = null;
    setSaveStatus('saved');
    return true;
  } catch (e) {
    console.error('Firestore save failed:', e);
    lastSaveError = (e.code ? '[' + e.code + '] ' : '') + (e.message || String(e));
    setSaveStatus('error');
    return false;
  }
}

async function manualSync() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  const ok = await saveToFirestore();
  if (!ok) {
    alert('저장 실패\n\n' + (lastSaveError || '알 수 없는 오류') +
          '\n\n진단:\n' +
          '· permission-denied → Firestore 보안 규칙 확인\n' +
          '· unavailable / network-request-failed → 진짜 인터넷/Firestore 다운\n' +
          '· requests-from-referer-blocked → API Key Restrictions (Google Cloud)에 firebaseapp.com 도메인 추가\n' +
          '· unauthenticated → 다시 로그인 필요\n\n' +
          '브라우저 콘솔 (F12 → Console 탭)에 자세한 에러 있음.');

// Render helpers
// ════════════════════════════════════════════════════
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'style') e.style.cssText = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    if (Array.isArray(c)) c.forEach(cc => { if (cc != null) e.appendChild(typeof cc === 'string' ? document.createTextNode(cc) : cc); });
    else e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  }
  return e;
}
function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = Math.max(ta.scrollHeight, 18) + 'px'; }
function taField(value, placeholder, onChange) {
  const t = el('textarea', { rows: 1, placeholder: placeholder || '' });
  t.value = value || '';
  setTimeout(() => autoResize(t), 0);
  t.addEventListener('input', () => { autoResize(t); onChange(t.value); saveState(); });
  return t;
}
function txtField(value, placeholder, onChange) {
  const i = el('input', { type: 'text', placeholder: placeholder || '' });
  i.value = value || '';
  i.addEventListener('input', () => { onChange(i.value); saveState(); });
  return i;
}
function statusPill(status, onChange) {

// ════════════════════════════════════════════════════
// Render
// ════════════════════════════════════════════════════
function renderLoadingScreen() {
  return el('div', { class: 'loading-screen' }, '...');
}
function renderLoginScreen() {
  return el('div', { class: 'login-screen' },
    el('div', { class: 'login-card' },
      el('h1', null, '주간 계획'),
      el('p', null, 'Google 계정으로 로그인하면 모든 기기에서 데이터가 자동 동기화됩니다. 본인만 본인 데이터에 접근 가능.'),
      el('button', { class: 'google-btn', onclick: doSignIn }, 'Google로 로그인'),
    ),
  );
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (!authResolved) { app.appendChild(renderLoadingScreen()); return; }
  if (!currentUser) { app.appendChild(renderLoginScreen()); return; }
  app.appendChild(renderTopbar());
  if (tab === 'month') {
    app.appendChild(renderMonthView());
    document.body.classList.remove('show-all-days');
  } else if (tab === 'today') {
    // 오늘 탭: 주간 내용 고정 없음. 그날만 집중.
    app.appendChild(renderDayPicker());
    app.appendChild(renderTodayView());
    document.body.classList.remove('show-all-days');
  } else {
    // week 탭
    app.appendChild(renderStats());
    app.appendChild(renderWeeklyCard());
    if (window.innerWidth <= 900) app.appendChild(renderDayPicker());
    app.appendChild(renderWeeklyGrid());
    document.body.classList.add('show-all-days');
    if (window.innerWidth <= 900) document.body.classList.remove('show-all-days');
    const w = getWeek(currentMonday);
    app.appendChild(renderIdeaSection(w));
    app.appendChild(renderBookmarkSection(w));
  }
  // 모달 컨테이너 (있으면 유지)
  const modalRoot = document.getElementById('modal-root');
  if (modalRoot) app.appendChild(modalRoot);
  app.appendChild(el('div', { style: 'text-align:center;padding:20px 0;font-size:11px;color:var(--text-tertiary);' },
    '클라우드 자동 저장 (Google 계정). 위 ↻ 동기화 버튼으로 즉시 저장 강제. ⤓/⤒ 는 JSON 파일 백업/복원.'));
  scheduleWeekNotifications();
}

function renderTopbar() {
  const monday = currentMonday;
  const sunday = addDays(monday, 6);
  const range = (monday.getMonth()+1) + '/' + monday.getDate() + ' — ' + (sunday.getMonth()+1) + '/' + sunday.getDate();
  const isCurrent = sameDate(monday, mondayOf(todayDate()));
  return el('div', { class: 'topbar' },
    el('h1', null, '주간 계획'),
    el('div', { class: 'week-nav' },
      el('button', { onclick: () => { currentMonday = addDays(currentMonday, -7); render(); } }, '‹'),
      el('div', { class: 'current' }, range),
      el('button', { onclick: () => { currentMonday = addDays(currentMonday, 7); render(); } }, '›'),
    ),
    !isCurrent && el('button', { class: 'today-jump', onclick: () => {
      currentMonday = mondayOf(todayDate()); currentDayIdx = (new Date().getDay()+6)%7; render();
    } }, '이번 주로'),
    el('div', { class: 'view-tabs' },
      el('button', { class: tab === 'month' ? 'active' : '', onclick: () => { tab = 'month'; render(); } }, '월간'),
      el('button', { class: tab === 'week' ? 'active' : '', onclick: () => { tab = 'week'; render(); } }, '주간'),
      el('button', { class: tab === 'today' ? 'active' : '', onclick: () => { tab = 'today'; render(); } }, '오늘'),
    ),
    el('div', { class: 'actions' },
      el('div', { id: 'save-indicator', class: 'save-indicator ' + saveStatus },
        saveStatus === 'saving' ? '저장 중...' :
        saveStatus === 'error' ? '저장 실패 ⚠' :
        lastSavedAt ? '방금 저장 ✓' : ''),
      el('button', { class: 'sync-btn', onclick: manualSync, title: '클라우드에 즉시 저장' }, '↻ 동기화'),
      el('button', { onclick: openFeedbackModal, class: 'small-btn', title: '피드백 / 개선 제안' }, '💬'),
      currentUser && currentUser.uid === ADMIN_UID ? el('button', { onclick: openFeedbackListModal, class: 'small-btn', title: '받은 피드백 보기 (admin)' }, '📥') : null,
      el('button', { onclick: openSettingsModal, class: 'small-btn', title: '설정 (AI key 등)' }, '⚙'),
      el('button', { onclick: exportJSON, class: 'small-btn', title: 'JSON 파일로 백업 다운로드' }, '⤓'),
      el('button', { onclick: importJSON, class: 'small-btn', title: 'JSON 백업 파일에서 복원' }, '⤒'),
      currentUser && el('button', {
        onclick: doSignOut,
        title: '로그아웃 — ' + (currentUser.email || ''),
        class: 'small-btn',
        style: 'color: var(--text-tertiary);'
      }, '로그아웃'),
    ),
  );
}

function renderStats() {
  const w = getWeek(currentMonday);
  const workTotal = w.rocks.work.filter(r => r.text.trim()).length;
  const workDone = w.rocks.work.filter(r => r.done && r.text.trim()).length;
  const lifeTotal = w.rocks.life.filter(r => r.text.trim()).length;
  const lifeDone = w.rocks.life.filter(r => r.done && r.text.trim()).length;
  let actionsTotal = 0, actionsDone = 0;
  for (const d of w.days) {
    for (const a of d.workActions) if (a.text.trim()) { actionsTotal++; if (a.status === 'done') actionsDone++; }
    for (const a of d.lifeActions) if (a.text.trim()) { actionsTotal++; if (a.status === 'done') actionsDone++; }
  }
  const reviewed = w.days.filter(d => d.review.trim()).length;
  return el('div', { class: 'stats-row' },
    el('div', { class: 'stat-card' },
      el('div', { class: 'stat-label' }, 'WORK Rock'),
      el('div', { class: 'stat-value' }, workDone + ' / ' + (workTotal || 0)),
      el('div', { class: 'stat-sub' }, workTotal > 0 ? Math.round(workDone/workTotal*100) + '% 완료' : '미설정'),
    ),
    el('div', { class: 'stat-card' },
      el('div', { class: 'stat-label' }, 'LIFE Rock'),
      el('div', { class: 'stat-value' }, lifeDone + ' / ' + (lifeTotal || 0)),
      el('div', { class: 'stat-sub' }, lifeTotal > 0 ? Math.round(lifeDone/lifeTotal*100) + '% 완료' : '미설정'),
    ),
    el('div', { class: 'stat-card' },
      el('div', { class: 'stat-label' }, '이번 주 액션'),
      el('div', { class: 'stat-value' }, actionsDone + ' / ' + actionsTotal),
      el('div', { class: 'stat-sub' }, actionsTotal > 0 ? Math.round(actionsDone/actionsTotal*100) + '% 완료' : '비어있음'),
    ),
    el('div', { class: 'stat-card' },
      el('div', { class: 'stat-label' }, '회고'),
      el('div', { class: 'stat-value' }, reviewed + ' / 7'),
      el('div', { class: 'stat-sub' }, '한 줄씩'),
    ),
  );
}

function renderWeeklyCard() {
  const w = getWeek(currentMonday);
  const today = todayDate();

  const workCol = el('div', { class: 'rock-col' },
    el('h3', null, 'WORK · ROCKS'),
    ...[0,1,2].map(i => {
      const r = w.rocks.work[i];
      return el('div', { class: 'rock-item work' + (r.done ? ' done' : '') },
        el('span', { class: 'check-btn', onclick: () => { r.done = !r.done; saveState(); render(); } }, r.done ? '☑' : '☐'),
        el('span', { class: 'n' }, String(i+1)),
        txtField(r.text, 'Rock ' + (i+1), v => { r.text = v; }),
      );
    }),
  );

  const lifeCol = el('div', { class: 'rock-col' },
    el('h3', null, 'LIFE · ROCKS'),
    ...[0,1].map(i => {
      const r = w.rocks.life[i];
      return el('div', { class: 'rock-item life' + (r.done ? ' done' : '') },
        el('span', { class: 'check-btn', onclick: () => { r.done = !r.done; saveState(); render(); } }, r.done ? '☑' : '☐'),
        el('span', { class: 'n' }, String(i+1)),
        txtField(r.text, 'Rock ' + (i+1), v => { r.text = v; }),
      );
    }),
  );

  const defaults = el('div', { class: 'default-slots' },
    el('div', { class: 'label' }, '추천 WORK 슬롯 (각 day에서 override 가능)'),
    ...[0,1,2].map(i =>
      txtField(w.defaultSlots[i], '카테고리 ' + (i+1), v => { w.defaultSlots[i] = v; })
    ),
  );

  const calRow = el('div', { class: 'calendar' });
  for (let i = 0; i < 7; i++) {
    const d = addDays(currentMonday, i);
    const isToday = sameDate(d, today);
    const evs = (w.calendarEvents || [])[i] || [];
    const pillContainer = el('div', { class: 'cal-pills', style: 'display:contents' });
    evs.slice(0, 3).forEach(ev => {
      const label = (ev.time ? ev.time + ' ' : '') + (ev.place || ev.memo || '');
      pillContainer.appendChild(el('div', { class: 'cal-event-pill' + (ev.time ? ' has-time' : '') }, label.trim() || '(메모)'));
    });
    if (evs.length > 3) pillContainer.appendChild(el('div', { class: 'cal-add-hint' }, '+' + (evs.length-3) + '개 더'));
    const dayCell = el('div', { class: 'cal-day' + (isToday ? ' today' : ''),
      onclick: () => openCalModal(i)
    },
      el('div', { class: 'dow' }, DAYS_KOR[i] + ' ' + d.getDate()),
      pillContainer,
    );
    if (evs.length === 0) dayCell.appendChild(el('div', { class: 'cal-add-hint' }, '+ 추가'));
    calRow.appendChild(dayCell);
  }

  return el('section', { class: 'weekly-card' },
    el('div', { class: 'rocks-grid' }, workCol, lifeCol),
    defaults,
    el('div', { class: 'section-title' }, '캘린더'),
    calRow,
  );
}

function renderDayPicker() {
  const today = todayDate();
  return el('div', { class: 'day-picker' },
    ...[0,1,2,3,4,5,6].map(i => {
      const d = addDays(currentMonday, i);
      const isToday = sameDate(d, today);
      const isActive = i === currentDayIdx;
      return el('button', {
        class: (isActive ? 'active ' : '') + (isToday ? 'today' : ''),
        onclick: () => { currentDayIdx = i; render(); }
      },
        el('span', { class: 'dow' }, DAYS_KOR[i]),
        el('span', { class: 'dd' }, String(d.getDate())),
      );
    }),
  );
}

// ─── 주간 탭: 7일 mini cards ───
function renderWeeklyGrid() {
  const w = getWeek(currentMonday);
  const today = todayDate();
  const grid = el('div', { class: 'weekly-grid' });
  for (let i = 0; i < 7; i++) {
    const d = addDays(currentMonday, i);
    grid.appendChild(renderMiniDayCard(w.days[i], d, i, sameDate(d, today), i === currentDayIdx));
  }
  return grid;
}

function renderMiniDayCard(day, date, dayIdx, isToday, isPickerActive) {
  const card = el('div', { class: 'day-card-mini' + (isToday ? ' today' : '') + (isPickerActive ? ' visible' : '') });
  card.appendChild(el('div', { class: 'day-header' },
    el('span', null, DAYS_KOR[dayIdx] + ' ' + (date.getMonth()+1) + '/' + date.getDate()),
    isToday ? el('span', { class: 'today-badge' }, '오늘') : null,
  ));
  // WORK actions (mini)
  const workBlock = el('div', { class: 'mini-section work-block' });
  workBlock.appendChild(el('div', { class: 'mini-label' }, 'WORK'));
  for (let j = 0; j < 3; j++) {
    const a = day.workActions[j];
    workBlock.appendChild(el('div', { class: 'mini-action' + (a.status === 'done' ? ' done' : '') },
      el('span', {
        class: 'status-mini',
        title: STATUS_LABEL[a.status],
        onclick: (ev) => { ev.stopPropagation(); a.status = nextStatus(a.status); saveState(); render(); }
      }, STATUS_ICON[a.status]),
      el('div', { class: 'mini-text' }, taField(a.text, '액션', v => { a.text = v; })),
    ));
  }
  card.appendChild(workBlock);

  // Contacts (mini)
  const contactBlock = el('div', { class: 'mini-section contact-block' });
  contactBlock.appendChild(el('div', { class: 'mini-label' }, '연락 (' + day.contacts.length + ')'));
  for (const c of day.contacts.slice(0, 4)) {
    contactBlock.appendChild(el('div', { class: 'mini-contact' + (c.checked ? ' done' : '') },
      el('span', { class: 'status-mini', onclick: () => { c.checked = !c.checked; saveState(); render(); } }, c.checked ? '✓' : '○'),
      el('span', null, c.name || c.purpose || '(빈 항목)'),
    ));
  }
  if (day.contacts.length > 4) contactBlock.appendChild(el('div', { style: 'font-size:10px;color:var(--text-tertiary);margin-top:2px;' }, '+' + (day.contacts.length - 4) + ' 더'));
  card.appendChild(contactBlock);

  // LIFE (mini)
  const lifeBlock = el('div', { class: 'mini-section life-block' });
  lifeBlock.appendChild(el('div', { class: 'mini-label' }, 'LIFE'));
  for (let j = 0; j < 3; j++) {
    const a = day.lifeActions[j];
    lifeBlock.appendChild(el('div', { class: 'mini-action' + (a.status === 'done' ? ' done' : '') },
      el('span', { class: 'status-mini', onclick: (ev) => { ev.stopPropagation(); a.status = nextStatus(a.status); saveState(); render(); } }, STATUS_ICON[a.status]),
      el('div', { class: 'mini-text' },
        el('span', { style: 'font-size:9px;color:var(--life-accent);opacity:0.7;display:block;font-weight:600;' }, LIFE_LABELS[j]),
        taField(a.text, '', v => { a.text = v; }),
      ),
    ));
  }
  card.appendChild(lifeBlock);

  // 회고 (mini)
  const reviewBlock = el('div', { class: 'mini-section review-block' });
  reviewBlock.appendChild(el('div', { class: 'mini-label' }, '회고'));
  reviewBlock.appendChild(taField(day.review, '한 줄', v => { day.review = v; }));
  card.appendChild(reviewBlock);

  return card;
}

// ─── 오늘 탭: full-width day ───
function renderTodayView() {
  const w = getWeek(currentMonday);
  const day = w.days[currentDayIdx];
  const date = addDays(currentMonday, currentDayIdx);
  const isToday = sameDate(date, todayDate());
  const view = el('div', { class: 'today-view' });

  // Header
  const workDone = day.workActions.filter(a => a.status === 'done' && a.text.trim()).length;
  const workTotal = day.workActions.filter(a => a.text.trim()).length;
  const lifeDone = day.lifeActions.filter(a => a.status === 'done' && a.text.trim()).length;
  const lifeTotal = day.lifeActions.filter(a => a.text.trim()).length;
  const contactDone = day.contacts.filter(c => c.checked).length;
  view.appendChild(el('div', { class: 'today-header' + (isToday ? ' is-today' : '') },
    el('h2', null,
      DAYS_KOR[currentDayIdx] + ' ' + (date.getMonth()+1) + '/' + date.getDate(),
      isToday ? el('span', { class: 'today-badge-lg' }, '오늘') : null,
    ),
    el('div', { style: 'display:flex;gap:10px;align-items:center;' },
      el('div', { class: 'summary' },
        el('span', null, 'WORK ', el('strong', null, workDone + '/' + workTotal)),
        el('span', null, 'LIFE ', el('strong', null, lifeDone + '/' + lifeTotal)),
        el('span', null, '연락 ', el('strong', null, contactDone + '/' + day.contacts.length)),
      ),
      el('button', { class: 'ai-fill-btn', onclick: openAIFillModal, title: '줄글 → AI 정리' }, '✨ AI로 정리'),
    ),
  ));

  // WORK 3 슬롯 (가로)
  const workRow = el('div', { class: 'work-slots-row' });
  for (let j = 0; j < 3; j++) {
    workRow.appendChild(renderWorkSlot(day, j, w));
  }
  view.appendChild(workRow);

  // 연락
  const contactSec = el('section', { class: 'contact-section' },
    el('h3', null, '연락'),
    el('div', { class: 'contact-list' },
      ...day.contacts.map((c, idx) => {
        const sub = [c.purpose, c.datetime ? new Date(c.datetime).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) : ''].filter(Boolean).join(' · ');
        return el('div', { class: 'contact-item' + (c.checked ? ' done' : ''),
          onclick: (e) => { if (!e.target.closest('.check-btn') && !e.target.closest('.del-btn')) openContactModal(day, idx); }
        },
          el('span', { class: 'check-btn', onclick: (e) => { e.stopPropagation(); c.checked = !c.checked; saveState(); render(); } }, c.checked ? '☑' : '☐'),
          el('div', { class: 'contact-preview' },
            el('div', { class: 'contact-name' }, c.name || '(이름 없음)'),
            sub ? el('div', { class: 'contact-sub' }, sub) : null,
          ),
          el('button', { class: 'del-btn', onclick: (e) => { e.stopPropagation(); day.contacts.splice(idx, 1); saveState(); render(); } }, '×'),
        );
      }),
      el('button', { class: 'add-contact', onclick: () => openContactModal(day, null) }, '+ 연락 추가'),
    ),
  );
  view.appendChild(contactSec);

  // 요청할 일 (내가 누구한테 시킬 것)
  view.appendChild(renderRequestSection(day, 'requestsToOthers', '요청할 일', '내가 ___에게 ___ 요청'));
  // 요청받은 일 (누가 나한테 시킨 것)
  view.appendChild(renderRequestSection(day, 'requestsFromOthers', '요청받은 일', '___님이 ___ 요청'));

  // LIFE
  const lifeSec = el('section', { class: 'life-section' },
    el('h3', null, 'LIFE'),
    el('div', { class: 'life-slots' },
      ...LIFE_LABELS.map((lab, j) => {
        const a = day.lifeActions[j];
        return el('div', { class: 'life-slot' + (a.status === 'done' ? ' done' : '') },
          el('div', { class: 'life-cat' }, lab),
          el('div', { class: 'life-action-row' },
            statusPill(a.status, ns => { a.status = ns; saveState(); render(); }),
            taField(a.text, '액션 (선택)', v => { a.text = v; }),
          ),
        );
      }),
    ),
  );
  view.appendChild(lifeSec);

  // 회고
  view.appendChild(el('section', { class: 'review-section' },
    el('h3', null, '회고'),
    taField(day.review, '오늘 무엇이 잘 됐고 무엇이 안 됐나 — 내일 계획의 입력값', v => { day.review = v; }),
  ));

  return view;
}

function renderRequestSection(day, key, title, placeholder) {
  const list = day[key];
  return el('section', { class: 'request-section ' + key },
    el('h3', null, title, el('span', { class: 'count' }, ' (' + list.length + ')')),
    el('div', { class: 'request-list' },
      ...list.map((r, idx) => el('div', { class: 'request-item' + (r.checked ? ' done' : '') },
        el('span', { class: 'check-btn', onclick: () => { r.checked = !r.checked; saveState(); render(); } }, r.checked ? '☑' : '☐'),
        taField(r.text, placeholder, v => { r.text = v; }),
        el('button', { class: 'del-btn', onclick: () => { list.splice(idx, 1); saveState(); render(); } }, '×'),
      )),
      el('button', { class: 'add-contact', onclick: () => { list.push({ checked: false, text: '' }); saveState(); render(); } }, '+ 추가'),
    ),
  );
}

function renderWorkSlot(day, j, week) {
  const a = day.workActions[j];
  const slot = el('div', { class: 'work-slot' + (a.status === 'done' ? ' done' : '') });
  // Header
  const defaultCat = week.defaultSlots[j] || '';
  slot.appendChild(el('div', { class: 'slot-header' },
    el('span', { class: 'slot-n' }, String(j+1)),
    el('div', { class: 'slot-cat', style: 'flex:1;min-width:0;' }, txtField(a.cat || defaultCat, defaultCat || ('WORK ' + (j+1)), v => { a.cat = v; })),
    statusPill(a.status, ns => { a.status = ns; saveState(); render(); }),
  ));
  // Action text
  slot.appendChild(el('div', { class: 'slot-action' + (a.status === 'done' ? ' done' : '') },
    taField(a.text, '오늘 끝낼 한 가지', v => { a.text = v; })
  ));
  // RPT 토글 (기본 접힘)
  const rptExpanded = !!a.rptExpanded;
  const tasksCount = a.tasks.filter(t => t.done).length;
  const tasksTotalAll = a.tasks.length;
  slot.appendChild(el('button', {
    class: 'wbs-toggle' + (rptExpanded ? ' expanded' : ''),
    onclick: () => { a.rptExpanded = !rptExpanded; saveState(); render(); }
  }, (rptExpanded ? '▾' : '▸') + ' R · P · T' + (tasksTotalAll > 0 ? `  ${tasksCount}/${tasksTotalAll}` : '')));
  // WBS area (R/P/T) - 펼쳐졌을 때만
  const wbsArea = el('div', { class: 'wbs-area' + (rptExpanded ? '' : ' collapsed') });
  wbsArea.appendChild(el('div', { class: 'wbs-row' },
    el('div', { class: 'wbs-label' }, 'R · 리소스'),
    taField(a.resources, '필요한 것', v => { a.resources = v; }),
  ));
  wbsArea.appendChild(el('div', { class: 'wbs-row' },
    el('div', { class: 'wbs-label' }, 'P · 사전조건'),
    taField(a.prereq, '시작 전 필요', v => { a.prereq = v; }),
  ));
  // Tasks: 동적 list + 체크박스 + 진행률
  const tasksDone = a.tasks.filter(t => t.done).length;
  const tasksTotal = a.tasks.length;
  const pct = tasksTotal > 0 ? Math.round(tasksDone/tasksTotal*100) : 0;
  const tasksRow = el('div', { class: 'wbs-row tasks-row' });
  const tasksHeader = el('div', { class: 'tasks-header' },
    el('div', { class: 'wbs-label', style: 'margin-bottom:0;' }, 'T · 할 일' + (tasksTotal > 0 ? `  ${tasksDone}/${tasksTotal} · ${pct}%` : '')),
  );
  if (tasksTotal > 0) tasksHeader.appendChild(el('div', { class: 'tasks-bar' }, el('div', { class: 'fill', style: 'width:' + pct + '%;' })));
  tasksRow.appendChild(tasksHeader);
  for (let ti = 0; ti < a.tasks.length; ti++) {
    const t = a.tasks[ti];
    const idx = ti;
    tasksRow.appendChild(el('div', { class: 'task-item' + (t.done ? ' done' : '') },
      el('span', { class: 'check-btn', onclick: () => { t.done = !t.done; saveState(); render(); } }, t.done ? '☑' : '☐'),

      el('button', { class: 'del-btn', onclick: () => { a.tasks.splice(idx, 1); saveState(); render(); } }, '×'),
    ));
  }
  tasksRow.appendChild(el('button', { class: 'add-task', onclick: () => { a.tasks.push({text:'',done:false}); saveState(); render(); } }, '+ 할 일 추가'));
  wbsArea.appendChild(tasksRow);
  slot.appendChild(wbsArea);
  return slot;
}

function buildAIPrompt(text) {
  return `다음은 사용자가 오늘 해야 할 일들을 자유롭게 쓴 줄글입니다:

"""
${text}
"""

이걸 다음 JSON 형식으로 정리해주세요. 빈 항목은 빈 문자열/배열로 두세요.

{
  "workActions": [
    { "text": "오늘 끝낼 핵심 업무 1", "cat": "카테고리 추측 (예: 경영/행정, TIPS, 영업, 제품개발, 위임 등)" }
  ],
  "lifeActions": {
    "자기계발": "(있으면 한 줄)",
    "건강": "(있으면 한 줄)",
    "소셜": "(있으면 한 줄)"
  },
  "contacts": [
    { "name": "연락할 사람", "purpose": "용건 한 줄" }
  ],
  "requestsToOthers": ["내가 누군가에게 시킬 일", ...],
  "requestsFromOthers": ["누가 나에게 시킨 일", ...],
  "review": "(만약 회고/반성 내용이 있으면, 없으면 빈 문자열)"
}

규칙:
- workActions은 최대 3개. 가장 중요한 업무 위주로.
- 카테고리는 줄글 내용에서 합리적으로 추측. 모호하면 빈 문자열.
- 연락은 사람한테 직접 닿는 것 (이메일/전화/만남). 일은 workActions에.
- 응답은 JSON 객체만. 설명/markdown 코드블록 없이.`;
}

async function callClaudeAPI(prompt) {
  const key = state.settings.anthropicKey;
  if (!key) throw new Error('API key 없음 — 설정에서 입력 필요');
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 2000,
      messages: [{ role: 'user', content: prompt }],
    }),
  });
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error('Claude API 오류 ' + resp.status + ': ' + errText.slice(0, 300));
  }
  const data = await resp.json();
  let content = data.content[0].text.trim();
  // markdown 코드블록 안 JSON 있는 경우 대응
  const m = content.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (m) content = m[1].trim();
  return JSON.parse(content);
}

function applyAIResult(r) {
  const w = getWeek(currentMonday);
  const day = w.days[currentDayIdx];
  // workActions: 빈 슬롯부터 채움
  if (Array.isArray(r.workActions)) {
    let slot = 0;
    for (const a of r.workActions) {
      while (slot < 3 && day.workActions[slot].text.trim()) slot++;
      if (slot >= 3) break;
      day.workActions[slot] = { ...emptyAction(), text: a.text || '', cat: a.cat || '' };
      slot++;
    }
  }
  // lifeActions
  if (r.lifeActions) {
    const map = { '자기계발': 0, '건강': 1, '소셜': 2 };
    for (const k in map) {
      if (r.lifeActions[k] && r.lifeActions[k].trim() && !day.lifeActions[map[k]].text.trim()) {
        day.lifeActions[map[k]] = { text: r.lifeActions[k], status: 'pending' };
      }
    }
  }
  // contacts
  if (Array.isArray(r.contacts)) {
    for (const c of r.contacts) {
      if ((c.name || c.purpose) && !day.contacts.some(x => (x.name || x.text) === c.name)) {
        day.contacts.push({ checked: false, name: c.name || '', purpose: c.purpose || '', datetime: '', place: '', memo: '', notify: false });
      }
    }
  }
  // requestsToOthers, requestsFromOthers
  if (Array.isArray(r.requestsToOthers)) {
    for (const t of r.requestsToOthers) if (t && t.trim() && !day.requestsToOthers.some(x => x.text === t)) day.requestsToOthers.push({ checked: false, text: t });
  }
  if (Array.isArray(r.requestsFromOthers)) {
    for (const t of r.requestsFromOthers) if (t && t.trim() && !day.requestsFromOthers.some(x => x.text === t)) day.requestsFromOthers.push({ checked: false, text: t });
  }
  // review (있으면 append)
  if (r.review && r.review.trim()) {
    day.review = day.review.trim() ? day.review + '\n' + r.review : r.review;
  }
  saveState();
}

// ─── 아이디어 섹션 (매트릭스 + 모달 추가) ───
function renderIdeaSection(w) {
  const ideaCells = w.matrix.idea;
  const totalCount = Object.values(ideaCells).reduce((sum, arr) => sum + (Array.isArray(arr) ? arr.length : 0), 0);
  const grid = el('div', { class: 'idea-matrix' }, el('div', { class: 'corner' }));
  for (let i = 0; i < IMPORTANCE.length; i++) {
    grid.appendChild(el('div', { class: 'col-head' + (i >= 2 ? ' high' : '') }, IMPORTANCE[i]));
  }
  for (const urg of URGENCY) {
    grid.appendChild(el('div', { class: 'row-head' + (urg === '매우긴급' ? ' urgent' : '') }, urg));
    for (const imp of IMPORTANCE) {
      const key = imp + '|' + urg;
      const items = ideaCells[key] || [];
      const cell = el('div', { class: 'idea-cell' });
      for (const it of items) {
        cell.appendChild(el('div', { class: 'idea-item', onclick: () => {
          openItemModal({
            title: '아이디어 편집',
            item: it,
            onSave: (data) => { Object.assign(it, data); saveState(); render(); },
            onDelete: () => { const idx = items.indexOf(it); if (idx >= 0) items.splice(idx, 1); saveState(); render(); },
          });
        } },
          el('div', { class: 'idea-title' }, it.title || '(제목 없음)'),
          it.link ? el('div', { class: 'idea-link' }, '🔗') : null,
        ));
      }
      cell.appendChild(el('button', { class: 'cell-add-btn', onclick: () => {
        openItemModal({
          title: `아이디어 추가 (${imp} · ${urg})`,
          item: { title: '', link: '', detail: '' },
          onSave: (data) => {
            items.push({ id: 'i' + Date.now() + Math.random().toString(36).slice(2,7), ...data });
            saveState(); render();
          },
        });
      } }, '+'));
      grid.appendChild(cell);
    }
  }
  return el('section', { class: 'matrix-section' },
    el('h2', null, el('span', null, '아이디어'), el('span', { class: 'badge' }, totalCount + ' 항목 · 이 주의')),
    grid,
  );
}

// ─── 북마크 섹션 (카테고리 컬럼 + 모달) ───
function renderBookmarkSection(w) {
  const bm = w.bookmark;
  const total = bm.items.length;
  const cols = el('div', { class: 'bookmark-cols' });
  for (let ci = 0; ci < bm.categories.length; ci++) {
    const cat = bm.categories[ci];
    const items = bm.items.filter(it => it.category === cat);
    const col = el('div', { class: 'bookmark-col' });
    col.appendChild(el('div', { class: 'bookmark-col-head' },
      el('span', { class: 'bookmark-cat-name' }, cat),
      el('span', { class: 'bookmark-cat-count' }, String(items.length)),
      bm.categories.length > 1 ? el('button', {
        class: 'bookmark-cat-del', title: '카테고리 삭제 (안 항목은 첫 카테고리로 이동)',
        onclick: () => {
          if (!confirm(`'${cat}' 카테고리를 삭제할까요? 안 항목들은 '${bm.categories[0] === cat ? bm.categories[1] : bm.categories[0]}'로 이동합니다.`)) return;
          const fallback = bm.categories[0] === cat ? bm.categories[1] : bm.categories[0];
          bm.items.forEach(it => { if (it.category === cat) it.category = fallback; });
          bm.categories.splice(ci, 1);
          saveState(); render();
        }
      }, '×') : null,
    ));
    for (const it of items) {
      col.appendChild(el('div', { class: 'bookmark-item', onclick: () => {
        openItemModal({
          title: '북마크 편집',
          item: it,
          extraFields: [{ name: 'category', label: '카테고리', type: 'select', options: bm.categories }],
          onSave: (data) => { Object.assign(it, data); saveState(); render(); },
          onDelete: () => { const idx = bm.items.indexOf(it); if (idx >= 0) bm.items.splice(idx, 1); saveState(); render(); },
        });
      } },
        el('div', { class: 'bookmark-title' }, it.title || '(제목 없음)'),
        it.link ? el('div', { class: 'bookmark-link' }, '🔗 ' + it.link.replace(/^https?:\/\//, '').slice(0, 30)) : null,
      ));
    }
    col.appendChild(el('button', { class: 'bookmark-add-btn', onclick: () => {
      openItemModal({
        title: `북마크 추가 (${cat})`,
        item: { title: '', link: '', detail: '', category: cat },
        extraFields: [{ name: 'category', label: '카테고리', type: 'select', options: bm.categories, default: cat }],
        onSave: (data) => {
          bm.items.push({ id: 'b' + Date.now() + Math.random().toString(36).slice(2,7), ...data });
          saveState(); render();
        },
      });
    } }, '+ 추가'));
    cols.appendChild(col);
  }
  // 카테고리 추가 버튼
  const addCatBtn = el('button', { class: 'bookmark-add-cat', onclick: () => {
    const name = prompt('새 카테고리 이름:');
    if (name && name.trim() && !bm.categories.includes(name.trim())) {
      bm.categories.push(name.trim()); saveState(); render();
    }
  } }, '+ 카테고리');
  return el('section', { class: 'matrix-section' },
    el('h2', null, el('span', null, '북마크'), el('span', { class: 'badge' }, total + ' 항목'), addCatBtn),
    cols,
  );
}

// ─── 월간 뷰 ───
function renderMonthView() {
  const m = new Date(monthCursor);
  m.setDate(1); m.setHours(0,0,0,0);
  const firstMonday = mondayOf(m);
  const lastDay = new Date(m.getFullYear(), m.getMonth()+1, 0);
  const lastSunday = addDays(mondayOf(lastDay), 6);
  const totalWeeks = Math.round((lastSunday - firstMonday) / (7*24*3600*1000)) + 1;
  const isCurrentMonth = m.getFullYear() === todayDate().getFullYear() && m.getMonth() === todayDate().getMonth();

  const header = el('div', { class: 'month-header' },
    el('button', { class: 'month-nav', onclick: () => { monthCursor = new Date(m.getFullYear(), m.getMonth()-1, 1); render(); } }, '‹'),
    el('h2', null, m.getFullYear() + '. ' + (m.getMonth()+1)),
    el('button', { class: 'month-nav', onclick: () => { monthCursor = new Date(m.getFullYear(), m.getMonth()+1, 1); render(); } }, '›'),
    !isCurrentMonth && el('button', { class: 'today-jump', onclick: () => { monthCursor = new Date(); monthCursor.setDate(1); render(); } }, '이번 달로'),
  );

  const grid = el('div', { class: 'month-grid' });
  // 요일 헤더
  for (const dow of DAYS_KOR) grid.appendChild(el('div', { class: 'month-dow' }, dow));

  // 한 달 통계 누적
  let monthTotal = 0, monthDone = 0, reviewDays = 0;

  for (let wi = 0; wi < totalWeeks; wi++) {
    const weekMonday = addDays(firstMonday, wi * 7);
    const wk = state.weeks[weekKey(weekMonday)] || null;
    for (let di = 0; di < 7; di++) {
      const date = addDays(weekMonday, di);
      const isThisMonth = date.getMonth() === m.getMonth();
      const isToday = sameDate(date, todayDate());
      const day = wk ? wk.days[di] : null;
      let actionsTotal = 0, actionsDone = 0;
      let taskTotal = 0, taskDone = 0;
      let hasReview = false;
      if (day && isThisMonth) {
        for (const a of day.workActions) if (a.text.trim()) {
          actionsTotal++;
          if (a.status === 'done') actionsDone++;
          for (const t of a.tasks) { taskTotal++; if (t.done) taskDone++; }
        }
        for (const a of day.lifeActions) if (a.text.trim()) {
          actionsTotal++;
          if (a.status === 'done') actionsDone++;
        }
        hasReview = !!day.review.trim();
        if (hasReview) reviewDays++;
        monthTotal += actionsTotal;
        monthDone += actionsDone;
      } else if (day) {
        for (const a of day.workActions) if (a.text.trim()) { actionsTotal++; if (a.status === 'done') actionsDone++; }
      }
      const pct = actionsTotal > 0 ? Math.round(actionsDone/actionsTotal*100) : 0;
      const rock1 = wk && wk.rocks && wk.rocks.work[0] && wk.rocks.work[0].text ? wk.rocks.work[0].text : '';

      const cellChildren = [
        el('div', { class: 'month-date' }, String(date.getDate())),
      ];
      if (actionsTotal > 0) {
        cellChildren.push(el('div', { class: 'month-bar' }, el('div', { class: 'fill', style: 'width:' + pct + '%;' })));
        cellChildren.push(el('div', { class: 'month-info' }, actionsDone + '/' + actionsTotal + (taskTotal > 0 ? ' · T ' + taskDone + '/' + taskTotal : '')));
      }
      if (hasReview) cellChildren.push(el('div', { class: 'month-review-badge' }, '✓ 회고'));
      if (di === 0 && rock1 && isThisMonth) cellChildren.push(el('div', { class: 'month-rock' }, rock1.length > 16 ? rock1.substring(0, 15) + '…' : rock1));

      grid.appendChild(el('div', {
        class: 'month-cell' + (isThisMonth ? '' : ' other-month') + (isToday ? ' today' : ''),
        title: DAYS_KOR[di] + ' ' + (date.getMonth()+1) + '/' + date.getDate() + ' — 클릭하여 오늘 탭으로',
        onclick: () => {
          currentMonday = mondayOf(date);
          currentDayIdx = (date.getDay()+6) % 7;
          tab = 'today';
          render();
        }
      }, ...cellChildren));
    }
  }

  // 한 달 요약 카드
  const monthPct = monthTotal > 0 ? Math.round(monthDone/monthTotal*100) : 0;
  const summary = el('div', { class: 'month-summary' },
    el('div', { class: 'stat-card' },
      el('div', { class: 'stat-label' }, '이번 달 액션'),
      el('div', { class: 'stat-value' }, monthDone + ' / ' + monthTotal),
      el('div', { class: 'stat-sub' }, monthPct + '% 완료'),
    ),
    el('div', { class: 'stat-card' },
      el('div', { class: 'stat-label' }, '회고 작성'),
      el('div', { class: 'stat-value' }, reviewDays + ' 일'),
      el('div', { class: 'stat-sub' }, lastDay.getDate() + '일 중'),
    ),
  );

  return el('section', { class: 'month-view' },
    summary,
    header,
    grid,
    el('div', { style: 'font-size:11px;color:var(--text-tertiary);margin-top:10px;text-align:center;' }, '셀 클릭 → 그 날의 오늘 탭으로 이동'),
  );
}

// ════════════════════════════════════════════════════
// Export / Import
// ════════════════════════════════════════════════════
async function exportJSON() {
  const json = JSON.stringify(state, null, 2);
  const filename = 'weekly_planner_' + fmtDate(new Date()) + '.json';
  const blob = new Blob([json], { type: 'application/json' });
  // 모바일 native share sheet 시도 (iOS Safari, Android Chrome 지원)
  try {
    const file = new File([blob], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '주간 계획 백업', text: filename });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // 사용자 share 취소
    console.warn('share failed, fallback to download:', e);
  }
  // Fallback: 일반 다운로드
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
}
function importJSON() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const parsed = JSON.parse(fr.result);
        if (!parsed.schemaVersion) throw new Error('invalid');
        if (!confirm('현재 데이터를 덮어씁니다. 진행할까요?')) return;
        if (parsed.schemaVersion === 1) state = migrateV1(parsed);
        else if (parsed.schemaVersion === SCHEMA_VERSION) state = parsed;
        else throw new Error('지원하지 않는 schema version: ' + parsed.schemaVersion);
        saveState(); render(); alert('Import 완료');
      } catch (e) { alert('Import 실패: ' + e.message); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

// ════════════════════════════════════════════════════
// PWA service worker register (호스팅 환경에서만)
// ════════════════════════════════════════════════════
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW register failed:', e));
  });
}

// ── 연락 모달 ──
let contactModalState = null; // { day, idx } 또는 { day, idx: null } (새 항목)

function openContactModal(day, idx) {
  contactModalState = { day, idx };
  renderContactModalDOM();
}
function closeContactModal() {
  contactModalState = null;
  const el2 = document.getElementById('contact-modal-overlay');
  if (el2) el2.remove();
}
function renderContactModalDOM() {
  const existing = document.getElementById('contact-modal-overlay');
  if (existing) existing.remove();
  if (!contactModalState) return;

  const { day, idx } = contactModalState;
  const isNew = idx === null;
  let c = isNew
    ? { checked: false, name: '', purpose: '', callMemo: '', datetime: '' }
    : { ...day.contacts[idx] };

  const overlay = el('div', { class: 'cal-modal-overlay', id: 'contact-modal-overlay',
    onclick: (e) => { if (e.target === overlay) closeContactModal(); }
  });

  const nameInput = el('input', { type: 'text', placeholder: '이름 또는 대상' });
  nameInput.value = c.name;
  nameInput.addEventListener('input', () => { c.name = nameInput.value; });

  const purposeInput = el('input', { type: 'text', placeholder: '용건' });
  purposeInput.value = c.purpose;
  purposeInput.addEventListener('input', () => { c.purpose = purposeInput.value; });

  const datetimeInput = el('input', { type: 'datetime-local' });
  datetimeInput.value = c.datetime;
  datetimeInput.addEventListener('change', () => { c.datetime = datetimeInput.value; });

  const memoTA = el('textarea', { placeholder: '통화 메모' });
  memoTA.value = c.callMemo;
  memoTA.addEventListener('input', () => { c.callMemo = memoTA.value; });

  const saveBtn = el('button', {
    class: 'cal-add-event-btn',
    style: 'border: none; background: var(--work-accent); color: #fff; font-weight: 600;',
    onclick: () => {
      if (!c.name.trim() && !c.purpose.trim()) { nameInput.focus(); return; }
      if (isNew) {
        day.contacts.push(c);
      } else {
        day.contacts[idx] = c;
      }
      saveState();
      render();
      closeContactModal();
    }
  }, isNew ? '추가' : '저장');

  const cancelBtn = el('button', { class: 'cal-modal-close', style: 'font-size:13px;color:var(--text-secondary);', onclick: closeContactModal }, '취소');

  const modal = el('div', { class: 'cal-modal', onclick: (e) => e.stopPropagation() },
    el('div', { class: 'cal-modal-header' },
      el('div', { class: 'cal-modal-title' }, isNew ? '연락 추가' : '연락 수정'),
      cancelBtn
    ),
    el('div', { class: 'contact-modal-field' }, el('label', null, '이름 / 대상'), nameInput),
    el('div', { class: 'contact-modal-field' }, el('label', null, '용건'), purposeInput),
    el('div', { class: 'contact-modal-field' }, el('label', null, '날짜 · 시간'), datetimeInput),
    el('div', { class: 'contact-modal-field' }, el('label', null, '통화 메모'), memoTA),
    saveBtn,
  );
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  setTimeout(() => nameInput.focus(), 80);
}

// ESC 키로 모달 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (calModalDayIdx !== null) closeCalModal();
    if (contactModalState !== null) closeContactModal();
  }
});

// ════════════════════════════════════════════════════
// Init
// ════════════════════════════════════════════════════
function listenToUserData(user) {
  unsubscribeUserDoc = onSnapshot(doc(db, 'users', user.uid), (snapshot) => {
    if (snapshot.metadata.hasPendingWrites) return; // self-write skip
    if (snapshot.exists()) {
      const data = snapshot.data();
      // 새 형식 (stateJson 문자열) 우선, 옛 형식 (state 객체) 호환
      let remote = null;
      if (data && data.stateJson) {
        try { remote = JSON.parse(data.stateJson); } catch (e) { console.warn('JSON parse fail', e); }
      } else if (data && data.state) {
        remote = data.state;
      }
      if (remote) {
        applyRemoteState(remote);
        return;
      }
    }
    // 첫 사용: 로컬 데이터 migrate 또는 sample
    let initial = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.weeks && Object.keys(parsed.weeks).length > 0) {
          if (confirm('이 기기에 저장된 데이터가 있어요. 클라우드로 옮길까요? (취소하면 sample로 시작)')) {
            initial = parsed.schemaVersion === SCHEMA_VERSION ? normalizeState(parsed)
                    : parsed.schemaVersion === 2 ? migrateV2to3(parsed)
                    : parsed.schemaVersion === 1 ? migrateV1(parsed) : null;
          }
        }
      }
    } catch (e) { console.warn('local migrate failed:', e); }
    state = initial || sampleState();
    render();
    saveToFirestore();
  }, (err) => {
    console.error('Firestore listen failed:', err);
    alert('데이터 sync 실패: ' + err.message + '\n\nFirestore 보안 규칙을 확인해주세요.');
  });
}

onAuthStateChanged(auth, (user) => {
  authResolved = true;
  if (unsubscribeUserDoc) { unsubscribeUserDoc(); unsubscribeUserDoc = null; }
  currentUser = user;
  if (user) {
    listenToUserData(user);
  } else {
    state = { schemaVersion: SCHEMA_VERSION, weeks: {} };
    render();
  }
});

window.addEventListener('resize', () => render());
render(); // 첫 로딩 화면
</script>
